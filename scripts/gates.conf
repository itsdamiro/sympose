# name | directory | command   (one gate per line; see scripts/gates)
lint      | .  | .venv/bin/ruff check .
pytest    | .  | .venv/bin/python -m pytest -q --deselect tests/test_main_web.py -p no:cacheprovider
typecheck | ui | npm run typecheck
eslint    | ui | npm run lint
vitest    | ui | npm run test
